name: KinoDEM LIGGGHTS v2

on:
  push:
    branches: [kinodem-liggghts-v2]
  workflow_dispatch:


concurrency:
  group: kinodem-liggghts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy pytest
      - name: Test LIGGGHTS case generator and parser
        run: PYTHONPATH=. pytest -q tests/test_kinodem_liggghts.py tests/test_kinodem_bias.py tests/test_kinodem_chaos.py
      - name: Generate inspectable case
        run: python kinodem_liggghts.py --prepare-only --workdir ci-liggghts-case --seconds 0.002
      - uses: actions/upload-artifact@v4
        with:
          name: kinodem-liggghts-generated-case
          path: ci-liggghts-case/

  liggghts-physical-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - name: Install Ubuntu LIGGGHTS 3.8
        run: |
          sudo apt-get update
          sudo apt-get install -y liggghts
          /usr/bin/liggghts -h > /tmp/liggghts-help.txt || true
          dpkg-query -W -f='\${Version}\n' liggghts | tee /tmp/liggghts-version.txt
      - name: Run real LIGGGHTS physical smoke case
        run: |
          python kinodem_liggghts.py \
            --workdir ci-liggghts-run \
            --seconds 0.002 \
            --dt 0.00001 \
            --seed 20260919 \
            --liggghts /usr/bin/liggghts
          cat ci-liggghts-run/selection.json
      - name: Run real LIGGGHTS Monte Carlo + bias smoke
        run: |
          python kinodem_liggghts.py \
            --workdir ci-liggghts-mc \
            --runs 8 \
            --seconds 0.002 \
            --dt 0.00001 \
            --seed 20260919 \
            --liggghts /usr/bin/liggghts
          python kinodem_bias.py ci-liggghts-mc/summary.json --out ci-liggghts-mc/bias.csv
          python - <<'PY'
          import json, math
          s=json.load(open("ci-liggghts-mc/summary.json"))
          assert s["runs"] == 8
          assert math.isclose(s["probability_sum"], 14.0, abs_tol=1e-12)
          assert sum(s["counts"]) == 8*14
          st=s["stability"]
          assert st["max_dt_over_rayleigh"] < st["rayleigh_limit"]
          assert st["max_dt_over_hertz"] < st["hertz_limit"]
          assert st["max_relative_travel_over_skin"] < st["skin_limit"]
          print("MC invariant OK:", s["probability_sum"])
          print("Stability:", st)
          PY
      - name: Run real LIGGGHTS twin-chaos experiment
        run: |
          python kinodem_chaos.py \
            --workdir ci-liggghts-chaos \
            --seconds 2.0 \
            --dt 0.00001 \
            --dump-every 1000 \
            --epsilon-v 0.000001 \
            --ball 1 \
            --axis 0 \
            --seed 20260919 \
            --liggghts /usr/bin/liggghts
          python - <<'PY'
          import json
          s=json.load(open("ci-liggghts-chaos/chaos_summary.json"))
          assert s["frames"] >= 100
          assert s["final_position_rms_m"] >= 0
          print("CHAOS_SUMMARY", json.dumps(s, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kinodem-liggghts-physical-smoke
          path: |
            ci-liggghts-run/
            ci-liggghts-mc/
            ci-liggghts-chaos/
            /tmp/liggghts-help.txt
            /tmp/liggghts-version.txt
