name: Probe public video mirrors for Kino 3279

on:
  push:
    branches: [kinodem-cfdem-v4.1-video-calibration]
    paths:
      - '.github/workflows/probe-kino-public-mirrors.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Probe Piped and Invidious APIs
        run: |
          set -euxo pipefail
          mkdir -p mirror-probe
          VIDEO=DUY2JTgHvsQ
          ok=0
          for BASE in             https://pipedapi.kavin.rocks             https://pipedapi.leptons.xyz             https://pipedapi.nosebs.ru             https://api-piped.mha.fi             https://piped-api.garudalinux.org
          do
            name=$(echo "$BASE" | sed 's#https://##; s#[^A-Za-z0-9]#_#g')
            if curl -L --fail --max-time 35 -A "Mozilla/5.0"               "$BASE/streams/$VIDEO" -o "mirror-probe/piped_$name.json"; then
              bytes=$(wc -c < "mirror-probe/piped_$name.json")
              echo "$BASE bytes=$bytes" | tee -a mirror-probe/success.txt
              if [ "$bytes" -gt 1000 ]; then ok=1; fi
            fi
          done

          for BASE in             https://invidious.nerdvpn.de             https://yt.chocolatemoo53.com             https://invidious.tiekoetter.com
          do
            name=$(echo "$BASE" | sed 's#https://##; s#[^A-Za-z0-9]#_#g')
            if curl -L --fail --max-time 35 -A "Mozilla/5.0"               "$BASE/api/v1/videos/$VIDEO" -o "mirror-probe/invidious_$name.json"; then
              bytes=$(wc -c < "mirror-probe/invidious_$name.json")
              echo "$BASE bytes=$bytes" | tee -a mirror-probe/success.txt
              if [ "$bytes" -gt 1000 ]; then ok=1; fi
            fi
          done

          python3 - <<'PY'
          import glob,json,os
          for f in glob.glob("mirror-probe/*.json"):
              try:
                  d=json.load(open(f))
              except Exception as e:
                  print("BAD",f,e); continue
              print("\nFILE",f)
              print("title",d.get("title"))
              print("duration",d.get("duration") or d.get("lengthSeconds"))
              print("videoStreams",len(d.get("videoStreams",[])))
              print("adaptiveFormats",len(d.get("adaptiveFormats",[])))
              pf=d.get("previewFrames") or d.get("storyboards") or []
              print("preview/storyboards",len(pf) if hasattr(pf,'__len__') else type(pf))
              if d.get("videoStreams"):
                  for s in d["videoStreams"][:5]:
                      print("STREAM",s.get("quality"),s.get("format"),s.get("videoOnly"),str(s.get("url",""))[:100])
          PY

          [ "$ok" -eq 1 ]
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kino3279-public-mirror-probe
          path: mirror-probe/
