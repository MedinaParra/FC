name: KinoFM GitHub Test

on:
  push:
    branches: [kinofm-experiment]
  workflow_dispatch:

jobs:
  baseline-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-base.txt
      - name: Install base dependencies
        run: python -m pip install -r requirements-base.txt
      - name: Download historical Chile Kino database
        run: curl -L --fail --retry 3 -o Sorteos.sqlite https://raw.githubusercontent.com/GioFranco79/kinoso/main/Sorteos.sqlite
      - name: Run unit tests
        run: PYTHONPATH=. pytest -q
      - name: Run full causal baseline audit
        run: |
          mkdir -p ci-results
          python kinofm_v4.py --sqlite Sorteos.sqlite --start 1600 --outdir ci-results | tee ci-results/baseline.log
      - uses: actions/upload-artifact@v4
        with:
          name: kinofm-baseline-results
          path: ci-results/

  timesfm3-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install KinoFM base dependencies
        run: python -m pip install -r requirements-base.txt
      - name: Install TimesFM 3.0 from current Google Research repository
        run: |
          git clone --depth 1 https://github.com/google-research/timesfm.git /tmp/timesfm
          cd /tmp/timesfm
          python -m pip install '.[torch]'
      - name: Download historical Chile Kino database
        run: curl -L --fail --retry 3 -o Sorteos.sqlite https://raw.githubusercontent.com/GioFranco79/kinoso/main/Sorteos.sqlite
      - name: TimesFM 3.0 CPU integration smoke test
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          mkdir -p ci-results
          python github_timesfm_matrix.py --sqlite Sorteos.sqlite --contexts 64,128,256,512 --n-test 100 --device cpu --batch-size 16 --outdir ci-results | tee ci-results/timesfm3-matrix.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kinofm-timesfm3-matrix
          path: ci-results/
