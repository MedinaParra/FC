name: KinoDEM CFD-DEM v3

on:
  push:
    branches: [kinodem-cfdem-v3]
  workflow_dispatch:

concurrency:
  group: kinodem-cfdem-${{ github.ref }}
  cancel-in-progress: true

jobs:
  case-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy pytest
      - name: Run case-generator tests
        run: PYTHONPATH=. pytest -q tests/test_kinodem_cfdem_case.py
      - name: Generate CFD-DEM case
        run: python kinodem_cfdem_case.py --out ci-cfdem-case --end-time 0.002 --base-cells 16
      - uses: actions/upload-artifact@v4
        with:
          name: kinodem-cfdem-generated-case
          path: ci-cfdem-case/

  cfdem-runtime-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Generate coupled case on host
        run: |
          python3 -m pip install --user numpy
          python3 kinodem_cfdem_case.py --out ci-cfdem-runtime --end-time 0.002 --base-cells 16
          chmod -R a+rwX ci-cfdem-runtime
      - name: Run coupled OpenFOAM-LIGGGHTS smoke case
        run: |
          docker pull hoehnp/docker-cfdem-pfm:latest
          docker inspect --format='Entrypoint={{json .Config.Entrypoint}} Cmd={{json .Config.Cmd}} Env={{json .Config.Env}}' hoehnp/docker-cfdem-pfm:latest
          docker run --rm \
            --entrypoint /bin/bash \
            -e BASH_ENV= \
            -v "$PWD:/work" \
            -w /work \
            hoehnp/docker-cfdem-pfm:latest \
            --noprofile --norc -c '
              set -x
              set +e
              set +u
              echo "BOOTSTRAP_START"
              source /opt/openfoam6/etc/bashrc
              echo "OPENFOAM_RC=$?"
              source /home/cfdem/CFDEM/CFDEMcoupling/etc/bashrc
              echo "CFDEM_RC=$?"
              echo "WM_PROJECT_DIR=${WM_PROJECT_DIR:-missing}"
              echo "CFDEM_SRC_DIR=${CFDEM_SRC_DIR:-missing}"
              echo "PATH=$PATH"
              command -v blockMesh || true
              command -v snappyHexMesh || true
              command -v cfdemSolverIB || true
              find /home/cfdem -type f -name cfdemSolverIB -o -name "libliggghts*" 2>/dev/null | head -30 || true
              set -e
              set -u
              cd /work/ci-cfdem-runtime
              bash Allrun.sh
            '
      - name: Collect runtime evidence
        if: always()
        run: |
          find ci-cfdem-runtime -maxdepth 4 -type f | sort > cfdem-files.txt || true
          grep -R -E "End|ERROR|FOAM FATAL|Loop time|coupl|LIGGGHTS" ci-cfdem-runtime/log_* > cfdem-log-summary.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kinodem-cfdem-runtime
          path: |
            ci-cfdem-runtime/
            cfdem-files.txt
            cfdem-log-summary.txt
