name: KinoDEM CFD-DEM v3

on:
  push:
    branches: [kinodem-cfdem-v3]
  workflow_dispatch:

concurrency:
  group: kinodem-cfdem-${{ github.ref }}
  cancel-in-progress: true

jobs:
  case-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy pytest
      - name: Run case-generator tests
        run: PYTHONPATH=. pytest -q tests/test_kinodem_cfdem_case.py
      - name: Generate CFD-DEM case
        run: python kinodem_cfdem_case.py --out ci-cfdem-case --end-time 0.002 --base-cells 16
      - uses: actions/upload-artifact@v4
        with:
          name: kinodem-cfdem-generated-case
          path: ci-cfdem-case/

  cfdem-runtime-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare writable workspace
        run: chmod -R a+rwX .
      - name: Generate and run coupled OpenFOAM-LIGGGHTS smoke case
        run: |
          docker pull hoehnp/docker-cfdem-pfm:latest
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            hoehnp/docker-cfdem-pfm:latest \
            bash -lc '
              set -euxo pipefail
              whoami
              echo "HOME=$HOME"
              python3 --version
              source /opt/openfoam6/etc/bashrc
              export CFDEM_PROJECT_DIR=/home/cfdem/CFDEM/CFDEMcoupling
              export CFDEM_SRC_DIR=$CFDEM_PROJECT_DIR/src
              export CFDEM_PROJECT_USER_DIR=/home/cfdem/CFDEM/cfdem-PUBLIC-6
              export CFDEM_LIGGGHTS_SRC_DIR=/home/cfdem/CFDEM/LIGGGHTS/src
              source /home/cfdem/CFDEM/CFDEMcoupling/etc/bashrc || true
              which blockMesh
              which snappyHexMesh
              which cfdemSolverIB
              python3 kinodem_cfdem_case.py --out ci-cfdem-runtime --end-time 0.002 --base-cells 16
              chmod +x ci-cfdem-runtime/Allrun.sh
              cd ci-cfdem-runtime
              ./Allrun.sh
            '
      - name: Collect runtime evidence
        if: always()
        run: |
          find ci-cfdem-runtime -maxdepth 4 -type f | sort > cfdem-files.txt || true
          grep -R -E "End|ERROR|FOAM FATAL|Loop time|coupl|LIGGGHTS" ci-cfdem-runtime/log_* > cfdem-log-summary.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kinodem-cfdem-runtime
          path: |
            ci-cfdem-runtime/
            cfdem-files.txt
            cfdem-log-summary.txt
