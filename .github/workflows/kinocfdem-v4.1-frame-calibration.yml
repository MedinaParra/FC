name: KinoCFDDEM v4.1 frame calibration

on:
  push:
    branches: [kinodem-cfdem-v4.1-video-calibration]
    paths:
      - 'kino_frame_calibration.py'
      - '.github/workflows/kinocfdem-v4.1-frame-calibration.yml'
  workflow_dispatch:

jobs:
  frame-calibration:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install video/calibration dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 -m pip install --user yt-dlp opencv-python-headless numpy pandas matplotlib

      - name: Download official Kino 3279 video
        run: |
          set +e
          mkdir -p frame-calibration
          URL="https://www.youtube.com/watch?v=DUY2JTgHvsQ"
          rm -f frame-calibration/kino3279.*
          ok=0
          for CLIENT in web_embedded android_vr tv_simply web_safari; do
            echo "TRY_CLIENT=$CLIENT"
            python3 -m yt_dlp \
              --js-runtimes node \
              --extractor-args "youtube:player_client=$CLIENT;player_skip=webpage" \
              -f "bv*[height<=720]+ba/b[height<=720]" \
              --merge-output-format mp4 \
              -o "frame-calibration/kino3279.%(ext)s" \
              "$URL"
            rc=$?
            if [ $rc -eq 0 ] && [ -s frame-calibration/kino3279.mp4 ]; then
              echo "DOWNLOAD_CLIENT=$CLIENT" | tee frame-calibration/download_method.txt
              ok=1
              break
            fi
            rm -f frame-calibration/kino3279.*
          done
          if [ $ok -ne 1 ]; then
            echo "All public unauthenticated clients failed."
            exit 1
          fi
          ls -lh frame-calibration/

      - name: Record source metadata
        run: |
          cat > frame-calibration/source_metadata.json <<'JSON'
          {
            "publisher": "Loteria de Concepcion",
            "video_id": "DUY2JTgHvsQ",
            "title": "Kino 3279 - Sunday, September 13, 2026",
            "published": "2026-09-13",
            "source_url": "https://www.youtube.com/watch?v=DUY2JTgHvsQ",
            "retrieval": "public unauthenticated yt-dlp client; exact client in download_method.txt"
          }
          JSON
          ffprobe -v error -show_entries format=duration:stream=width,height,r_frame_rate,avg_frame_rate,codec_name \
            -of json frame-calibration/kino3279.mp4 \
            > frame-calibration/video_probe.json

      - name: Run frame-by-frame calibration
        run: |
          python3 kino_frame_calibration.py \
            frame-calibration/kino3279.mp4 \
            --outdir frame-calibration/results \
            --redetect-every 10 \
            | tee frame-calibration/frame-calibration.log

      - name: Validate output contract
        run: |
          python3 - <<'PY'
          import json, pandas as pd
          from pathlib import Path
          p=Path("frame-calibration/results")
          s=json.loads((p/"frame_summary.json").read_text())
          df=pd.read_csv(p/"frame_measurements.csv")
          assert len(df)==s["frames_total_processed"]
          assert "ratio" in df.columns and "accepted" in df.columns
          assert (p/"ratio_timeseries.png").exists()
          print("SUMMARY",json.dumps(s,indent=2))
          print("CSV_ROWS",len(df))
          print("ACCEPTED",int(df["accepted"].sum()))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kinocfdem-v4.1-frame-calibration-3279
          compression-level: 6
          path: |
            frame-calibration/source_metadata.json
            frame-calibration/download_method.txt
            frame-calibration/video_probe.json
            frame-calibration/frame-calibration.log
            frame-calibration/results/
